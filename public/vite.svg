<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente suave para o fundo dark premium -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <!-- Brilho sutil para o "S" central -->
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <!-- Base do Favicon (Squircle / Cantos Arredondados) -->
  <rect x="32" y="32" width="448" height="448" rx="110" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="8"/>

  <g transform="translate(8, 0)">
    <!-- Tag de Abertura: < (Azul SENAI) -->
    <path d="M 160 160 L 80 256 L 160 352" 
          fill="none" 
          stroke="#00569c" 
          stroke-width="46" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- O "S" de SENAI estilizado como uma barra de código (/) modificada -->
    <path d="M 295 155 C 220 155 210 225 256 256 C 302 287 292 357 217 357" 
          fill="none" 
          stroke="url(#sGrad)" 
          stroke-width="50" 
          stroke-linecap="round" />

    <!-- Tag de Fechamento: > (Vermelho SENAI) -->
    <path d="M 336 160 L 416 256 L 336 352" 
          fill="none" 
          stroke="#ff3b30" 
          stroke-width="46" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
